<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--maroon:#6d1a2e;--maroon-dark:#4a0f1f;--gold:#c9a24b;--gold-light:#e8d7a8;--cream:#faf6ee;--ink:#5a4632}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cormorant Garamond',serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:190px}
header{background:linear-gradient(135deg,var(--maroon-dark),var(--maroon));color:#f6ecd8;padding:18px 18px 14px;position:sticky;top:0;z-index:20;box-shadow:0 6px 20px rgba(74,15,31,.25)}
header .top{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
header a{color:var(--gold-light);text-decoration:none;font-size:22px;line-height:1}
header .t{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.14em}
header .save{font-size:12.5px;font-style:italic;opacity:.8}
.steps{display:flex;gap:6px;max-width:640px;margin:12px auto 0}
.steps i{flex:1;height:4px;border-radius:4px;background:rgba(246,236,216,.25);transition:.3s}
.steps i.done{background:var(--gold)}
main{max-width:640px;margin:0 auto;padding:22px 18px}
.step{display:none}
.step.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-family:'Cinzel',serif;color:var(--maroon);letter-spacing:.1em;font-size:19px;margin-bottom:4px}
.sub{font-style:italic;color:#98815f;font-size:15px;margin-bottom:18px}
.section-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.12em;color:#8a6a25;margin:20px 0 14px;padding-top:10px;border-top:1px solid #ecdfc4}
label{display:block;font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.14em;color:#8a6a25;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid #e5d8bd;border-radius:12px;background:#fff;font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--ink);outline:none;transition:.2s}
input[type="file"]{padding:8px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15)}
input.invalid{border-color:#b3413f}

.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cardhead b{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.12em;color:var(--maroon)}
.switch{position:relative;width:46px;height:26px;flex:0 0 46px}

.switch span{position:absolute;inset:0;border-radius:999px;background:#ddceac;transition:.25s}

.btn{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;padding:14px 10px;border-radius:13px;border:none;cursor:pointer;transition:.2s}

.linkbox{background:#fff;border:1.5px dashed var(--gold);border-radius:14px;padding:14px;margin:18px 0;font-size:15px;word-break:break-all;color:var(--maroon)}

.upload-overlay{display:none;position:fixed;inset:0;background:rgba(20,10,8,.85);z-index:200;flex-direction:column;align-items:center;justify-content:center;color:#f6ecd8;text-align:center;padding:20px}

.uo-msg{margin-top:18px;font-family:'Cinzel',serif;letter-spacing:.1em;font-size:14px}

<body>
<header>
  <div class="top">

<script>
localStorage.clear();
sessionStorage.clear();

const qs = new URLSearchParams(location.search);
const TPL = qs.get('template') === 'cinematic' ? 'cinematic' : 'basic';
const KEY = 'wedding_draft_' + TPL;

let D = {
  groom:'', bride:'', weddingDate:'', venueName:'', venueAddress:'', city:'', whatsapp:'', hashtag:'',
  showCountdown:true,
  showBlessings:false,
  groomParents:{father:'',mother:''}, brideParents:{father:'',mother:''},
  groomFamily:'Sharma', brideFamily:'Kapoor',
  events:{
    mehendi:{on:true,name:'Mehendi Ceremony',date:'',time:'',venue:'',desc:''},
    haldi:{on:true,name:'Haldi Ceremony',date:'',time:'',venue:'',desc:''},
    sangeet:{on:true,name:'Sangeet Celebration',date:'',time:'',venue:'',desc:''},
    wedding:{on:true,name:'Wedding Ceremony',date:'',time:'',venue:'',desc:''}
  },
  customEvents:[],
  showStory:false,
  howWeMet:'', perfectMorning:'', description:'', customHashtag:'',
  showGallery:false,
  photos:{1:null,2:null,3:null,4:null},
  showMusic:false,
  musicFile:null,
  musicName:'',
  musicSource:'default', // 'default' | 'library' | 'custom'
  infoCards:{address:{on:false,value:''},parking:{on:false,value:''},registry:{on:false,value:''},stayInfo:{on:false,value:''}},
  rsvpWhatsapp:'',
  rsvpMessage:''
};

let step = 0;

const SUPPORT_PHONE = '+918979324895';
const SUPPORT_PHONE_DISPLAY = '+91 89793 24895';
const TODAY = new Date().toISOString().slice(0,10);
// accepts 10-15 digits so both plain Indian mobiles and numbers with a
// country code (NRI guests etc.) pass, while still rejecting garbage like "abc"
const isValidPhone = v => { const d=(v||'').replace(/\D/g,''); return d.length>=10 && d.length<=15; };
const fld = (label, path, opts={}) => `
  <label>${label}</label>
  <input type="${opts.type||'text'}" data-path="${path}" placeholder="${opts.ph||''}" value="${get(path)||''}"${opts.maxlength?` maxlength="${opts.maxlength}"`:''}${opts.type==='date'?` min="${TODAY}"`:''}>
  ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}`;

const txtarea = (label, path, opts={}) => `
  <label>${label}</label>
  <textarea data-path="${path}" placeholder="${opts.ph||''}"${opts.maxlength?` maxlength="${opts.maxlength}"`:''}>${get(path)||''}</textarea>
  ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}`;

function get(p){ return p.split('.').reduce((o,k)=>o&&o[k], D); }
function set(p,v){ const ks=p.split('.'); let o=D; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks.at(-1)]=v; }
function save(){
  try {
    // photos/musicFile are base64 and can run several MB each; keeping them out of
    // localStorage avoids exceeding the browser's per-origin quota, which used to
    // throw uncaught and silently abort whichever handler called save() first
    // (every toggle switch's re-render, the Preview button, etc.)
    const { photos, musicFile, ...persisted } = D;
    localStorage.setItem(KEY, JSON.stringify(persisted));
    localStorage.setItem(KEY+'_step', step);
  } catch (e) { console.warn('draft autosave skipped:', e); }
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

// Phone photos routinely run 5-15MB; resizing to a sane display size before
// base64-encoding keeps the draft small enough for localStorage and for the
// server's request body (Vercel caps serverless function bodies at ~4.5MB).
function compressImage(file, maxDim=1600, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = () => reject(new Error('invalid image'));
      img.onload = ()=>{
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function showUploadOverlay(msg){
  document.getElementById('uploadOverlayMsg').textContent = msg;
  document.getElementById('uploadOverlay').classList.add('show');
}
function hideUploadOverlay(){
  document.getElementById('uploadOverlay').classList.remove('show');
}

// fetched once, cached, and re-rendered from cache on every visit to this
// step so switching tabs back and forth doesn't re-hit the network
let libraryTracks = null;
let currentPreviewAudio = null;
async function loadLibraryIfNeeded(){
  if (!document.getElementById('libraryList')) return;
  if (libraryTracks === null) {
    try { libraryTracks = await fetch('/api/music-library').then(r=>r.json()); }
    catch (e) { libraryTracks = []; }
  }
  renderLibraryList();
}
function renderLibraryList(){
  const listEl = document.getElementById('libraryList');
  if (!listEl) return;
  if (!libraryTracks || !libraryTracks.length) {
    listEl.innerHTML = '<div class="hint">No songs in the library yet — try Upload Custom instead.</div>';
    return;
  }
  listEl.innerHTML = libraryTracks.map(t => `
    <div class="lib-track ${D.musicFile===t.url?'sel':''}" data-url="${t.url}" data-name="${t.name}">
      <button type="button" class="lib-play" data-url="${t.url}">▶</button>
      <span class="lib-name">${t.name}</span>
      <span class="lib-check">${D.musicFile===t.url?'✓ Selected':'Select'}</span>
    </div>`).join('');

  listEl.querySelectorAll('.lib-play').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const url = btn.dataset.url;
      if (currentPreviewAudio && !currentPreviewAudio.paused && currentPreviewAudio.dataset && currentPreviewAudio.src.endsWith(url)) {
        currentPreviewAudio.pause();
        btn.textContent = '▶';
        return;
      }
      if (currentPreviewAudio) currentPreviewAudio.pause();
      listEl.querySelectorAll('.lib-play').forEach(b=>b.textContent='▶');
      currentPreviewAudio = new Audio(url);
      currentPreviewAudio.play().catch(()=>toast('Could not play preview'));
      btn.textContent = '⏸';
      currentPreviewAudio.addEventListener('ended', ()=>{ btn.textContent='▶'; });
    });
  });

  listEl.querySelectorAll('.lib-track').forEach(row=>{
    row.addEventListener('click', ()=>{
      D.musicFile = row.dataset.url;
      D.musicName = row.dataset.name;
      D.showMusic = true;
      save();
      renderLibraryList(); // just refresh selection state, no full draw()
    });
  });
}

  </div>
  <div class="card">
    <div class="cardhead"><b>PARKING</b><label class="switch" style="margin:0"><input type="checkbox" data-toggle-info="parking" ${D.infoCards.parking.on?'checked':''}><span></span></label></div>
    <div class="body" style="display:${D.infoCards.parking.on?'block':'none'}"><textarea data-path="infoCards.parking.value" placeholder="Parking info" maxlength="300">${D.infoCards.parking.value}</textarea></div>
  </div>
  <div class="card">
    <div class="cardhead"><b>GIFT REGISTRY</b><label class="switch" style="margin:0"><input type="checkbox" data-toggle-info="registry" ${D.infoCards.registry.on?'checked':''}><span></span></label></div>
    <div class="body" style="display:${D.infoCards.registry.on?'block':'none'}"><input type="url" data-path="infoCards.registry.value" placeholder="https://registry.com" value="${D.infoCards.registry.value}" maxlength="200"></div>
  </div>
  <div class="card">
    <div class="cardhead"><b>STAY INFO</b><label class="switch" style="margin:0"><input type="checkbox" data-toggle-info="stayInfo" ${D.infoCards.stayInfo.on?'checked':''}><span></span></label></div>
    <div class="body" style="display:${D.infoCards.stayInfo.on?'block':'none'}"><textarea data-path="infoCards.stayInfo.value" placeholder="Hotel info" maxlength="300">${D.infoCards.stayInfo.value}</textarea></div>
  </div>

  <div class="section-title">RSVP</div>
  ${fld('RSVP WhatsApp Number','rsvpWhatsapp',{type:'tel', ph:'9811112222', maxlength:15})}
  ${fld('RSVP Message','rsvpMessage',{ph:'I\'ll be attending!', maxlength:150})}` },

{ title:'REVIEW & PAY', sub:'Final check', html:()=>`
  <div class="review"><h4>COUPLE</h4><div>${D.groom||'—'} ❤ ${D.bride||'—'}</div></div>
  <div class="review"><h4>VENUE</h4><div>${D.venueName||'—'}, ${D.city||'—'}</div></div>
  <div class="review"><h4>GALLERY</h4><div>${D.showGallery ? '✓ Enabled' : '✗ Disabled'}</div></div>
  <div class="review"><h4>STORY</h4><div>${D.showStory ? '✓ Enabled' : '✗ Disabled'}</div></div>
  <div class="pricebox">
    <div style="font-size:24px;color:#c9a24b">₹ ${TPL==='cinematic'?'1,499':'899'}</div>
  </div>
  <button class="btn next" id="payBtn" style="width:100%;padding:17px">💳 PAY & PUBLISH</button>
  <div class="trust">🔒 Secured by Razorpay · your card details never touch our servers</div>
  <a href="tel:${SUPPORT_PHONE}" class="callus">📞 Payment not going through? Call us — ${SUPPORT_PHONE_DISPLAY}</a>` },
];

let lastSentPhone = null;
function bind(){
  document.querySelectorAll('input[data-path]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ set(inp.dataset.path, inp.value); save(); });
  });

  // flag any phone field that doesn't look like a real number on blur —
  // whatsapp/rsvpWhatsapp both feed real wa.me links on the published invite,
  // so a typo here means a guest hits a dead RSVP link, not just a cosmetic issue
  document.querySelectorAll('input[data-path="whatsapp"], input[data-path="rsvpWhatsapp"]').forEach(inp=>{
    inp.addEventListener('blur', ()=>{
      inp.classList.toggle('invalid', inp.value.trim() !== '' && !isValidPhone(inp.value));
    });
  });

  // auto-prefix the registry link with https:// if they forgot it — a bare
  // "registry.com" would otherwise render as a dead link on the invite
  const registryInput = document.querySelector('input[data-path="infoCards.registry.value"]');
  if (registryInput) {
    registryInput.addEventListener('blur', ()=>{
      const v = registryInput.value.trim();
      if (v && !/^https?:\/\//i.test(v)) {
        registryInput.value = 'https://' + v;
        set('infoCards.registry.value', registryInput.value);
        save();
      }
    });
  }

  // capture a lead for follow-up as soon as they leave the WhatsApp number
  // field with something that looks real — catches people who never reach Pay
  const waInput = document.querySelector('input[data-path="whatsapp"]');
  if (waInput) {
    waInput.addEventListener('blur', () => {
      const digits = waInput.value.replace(/\D/g, '');
      if (digits.length < 10 || digits === lastSentPhone) return;
      const prev = lastSentPhone;
      lastSentPhone = digits;
      fetch('/api/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: digits, groom: D.groom, bride: D.bride, template: TPL }) })
        .catch(() => { lastSentPhone = prev; }); // best-effort, retry on next blur if it failed
    });
  }
  document.querySelectorAll('textarea[data-path]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ set(inp.dataset.path, inp.value); save(); });
  });
  
  document.querySelectorAll('input[data-toggle-countdown]').forEach(t=>{
    t.addEventListener('change', ()=>{ D.showCountdown=t.checked; save(); });
  });
  document.querySelectorAll('input[data-toggle-blessings]').forEach(t=>{
    t.addEventListener('change', ()=>{ D.showBlessings=t.checked; save(); draw(); });
  });
  document.querySelectorAll('input[data-toggle-event]').forEach(t=>{
    t.addEventListener('change', ()=>{ D.events[t.dataset.toggleEvent].on=t.checked; save(); draw(); });
  });
  document.querySelectorAll('input[data-toggle-story]').forEach(t=>{
    t.addEventListener('change', ()=>{ D.showStory=t.checked; save(); draw(); });
  });
  document.querySelectorAll('input[data-toggle-gallery]').forEach(t=>{
    t.addEventListener('change', ()=>{ D.showGallery=t.checked; save(); draw(); });
  });
  document.querySelectorAll('input[name="musicSource"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      // switching tabs always starts fresh in the new one — otherwise a
      // library pick carried into the Custom tab (or vice versa) shows a
      // misleading "already uploaded/selected" confirmation for a file that
      // doesn't actually belong to that tab
      const switchedTab = D.musicSource !== r.value;
      D.musicSource = r.value;
      if (r.value === 'default' || switchedTab) { D.showMusic=false; D.musicFile=null; D.musicName=''; }
      save(); draw();
    });
  });
  if (D.musicSource === 'library') loadLibraryIfNeeded();
  document.querySelectorAll('input[data-toggle-info]').forEach(t=>{
    t.addEventListener('change', ()=>{ D.infoCards[t.dataset.toggleInfo].on=t.checked; save(); draw(); });
  });
  
  document.querySelectorAll('input[data-photo]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const file = inp.files[0];
      if(!file) return;
      if(!file.type.startsWith('image/')) return toast('Please choose an image file');
      try {
        D.photos[inp.dataset.photo] = await compressImage(file);
        save(); draw();
      } catch (e) {
        toast('Could not process that photo — try a different one');
      }
    });
  });

  const musicFile = document.getElementById('musicFile');
  if(musicFile){
    musicFile.addEventListener('change', async ()=>{
      const file = musicFile.files[0];
      if(!file) return;
      // uploaded on its own via /api/upload-music (raw binary, not base64-in-JSON),
      // so it isn't sharing Vercel's ~4.5MB request-body cap with anything else
      if(file.size > 4.5*1024*1024){ toast('Music file too large — please pick one under 4.5MB'); musicFile.value=''; return; }
      showUploadOverlay('UPLOADING MUSIC…');
      try {
        const fd = new FormData();
        fd.append('music', file);
        const r = await fetch('/api/upload-music', { method:'POST', body: fd });
        const j = await r.json();
        if(!r.ok) { toast('Music upload failed: ' + (j.error || 'try a different file')); return; }
        D.musicFile = j.url;
        D.musicName = file.name;
        D.showMusic = true;
        save(); draw();
        toast('Music uploaded ✓');
      } catch (e) {
        toast('Music upload failed — check your connection');
      } finally {
        hideUploadOverlay();
      }
    });
  }
}

function draw(){
  document.getElementById('stepsBar').innerHTML = STEPS.map((_,i)=>`<i class="${i<=step?'done':''}"></i>`).join('');
  const s = STEPS[step];
  document.getElementById('main').innerHTML = `<div class="step on"><h2>${s.title}</h2><div class="sub">${s.sub}</div>${s.html()}</div>`;
  document.getElementById('btnPrev').style.visibility = step? 'visible':'hidden';
  document.getElementById('btnNext').style.display = step===STEPS.length-1 ? 'none':'block';
  bind();
  if(step===STEPS.length-1) bindPay();
  window.scrollTo(0,0);
}

async function bindPay(){
  document.getElementById('payBtn').onclick = async ()=>{
    if(!D.groom.trim()||!D.bride.trim()) return toast('Couple names fill kar do!');
    let o;
    try {
      const r = await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({template:TPL, data:D})});
      o = await r.json().catch(()=>({}));
      if(!r.ok) return toast(o.error || 'Order failed — try smaller photos/music');
    } catch (e) { return toast('Order failed — check your connection'); }
    if(o.error) return toast('Order failed: '+o.error);
    new Razorpay({
      key:o.keyId, amount:o.amount, currency:'INR', order_id:o.orderId,
      name:'Wedding Invitation', description:'Beautiful shaadi invitation',
      theme:{color:'#6d1a2e'},
      handler: async (resp)=>{
        try {
          const vr = await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({internalId:o.internalId, ...resp})});
          const v = await vr.json();
          if(v.success){
            document.getElementById('main').innerHTML = `
              <div style="text-align:center;padding:40px 10px">
                <div style="font-family:'Great Vibes',cursive;font-size:40px;color:#6d1a2e">🎉 Published!</div>
                <div class="linkbox">${window.location.origin}/invite/${v.inviteId}</div>
                <button class="copybtn" onclick="navigator.clipboard.writeText('${window.location.origin}/invite/${v.inviteId}');toast('Copied!')">📋 COPY</button>
                <a href="https://wa.me/?text=${encodeURIComponent('My wedding invitation: '+window.location.origin+'/invite/'+v.inviteId)}" class="wabtn">📱 SHARE</a>
              </div>`;
            document.querySelector('.nav').style.display='none';
          } else {
            toast('Payment verification failed — contact support');
          }
        } catch (e) { toast('Payment verification failed — check your connection'); }
      }
    }).open();
  };
}

document.getElementById('btnPrev').onclick = ()=>{ if(step>0){step--;draw();} };
document.getElementById('btnNext').onclick = ()=>{
  if(step===0 && (!D.groom.trim()||!D.bride.trim())) return toast('Names fill kar do!');
  if(step===0 && D.whatsapp.trim() && !isValidPhone(D.whatsapp)) return toast('WhatsApp number sahi se daalo (10 digits)');
  if(step===4 && D.rsvpWhatsapp.trim() && !isValidPhone(D.rsvpWhatsapp)) return toast('RSVP WhatsApp number sahi se daalo');
  if(step<STEPS.length-1){step++;draw();}
};
document.getElementById('btnPreview').onclick = async ()=>{
  save();
  try {
    const r = await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({template:TPL, data:D})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) return toast(j.error || 'Preview failed — try smaller photos/music');
    if(j.token) window.open('/preview/'+j.token, '_blank');
  } catch (e) { toast('Preview failed — check your connection'); }
};

draw();
</script>
